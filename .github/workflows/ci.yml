name: CI

# Runs the whole check list from the README on Linux and Windows. The Windows job exists because
# Unix-only code has slipped past review twice (it compiled and passed on Linux only).

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the kernel binary
        run: cargo build

      - name: Rust tests
        run: cargo test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova-shell/pyproject.toml

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e nova-shell pytest PyYAML httpx jsonschema

      # Without the binary most kernel tests skip quietly and the suite looks green, so check it.
      - name: The kernel binary can be found by both Python packages
        run: |
          python -c "from runtime.kernel import find_binary; print(find_binary())"
          cd nova-shell && python -c "from nova.ick import _find_binary; print(_find_binary(None))"

      - name: Python tests (repository root)
        run: python -m pytest tests -q -rsf

      - name: Python tests (nova-shell)
        working-directory: nova-shell
        run: python -m pytest tests -q -rsf
        env:
          PYTHONPATH: .

      # The operator screen is also driven in a real browser. Linux only: it needs Node + Playwright.
      - name: Browser tests (operator screen)
        if: runner.os == 'Linux'
        working-directory: nova-shell
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" python -m pytest tests/test_operator_browser.py -q -rs
        env:
          PYTHONPATH: .
