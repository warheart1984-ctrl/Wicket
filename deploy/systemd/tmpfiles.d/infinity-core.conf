# Directories and their modes. Install as /usr/lib/tmpfiles.d/infinity-core.conf and run
# `systemd-tmpfiles --create`. The "2" in 2750 is the setgid bit: files created inside take the
# directory's group (ick-audit), so the operator and the publisher can read what the signer writes.
#
# Type Path                        Mode  User           Group      Age Argument
d      /etc/ick                    0755  root           root       -
d      /etc/ick/human              0755  root           root       -
d      /var/lib/ick                0750  ick-signer     ick-audit  -
d      /var/lib/ick/log            2750  ick-signer     ick-audit  -
d      /var/lib/ick/anchor         2750  ick-signer     ick-audit  -
d      /var/lib/ick-publisher      2750  ick-publisher  ick-audit  -
d      /etc/ick-publisher          0750  ick-publisher  ick-publisher -
d      /etc/nova                   0750  root           nova       -
d      /var/lib/nova               0750  nova           nova       -
d      /var/lib/nova/ick-state     2750  nova           ick-audit  -
# /etc/ick/human is created root-owned here so a fresh install is safe; hand it to the operator:
#   chown <your-login> /etc/ick/human
