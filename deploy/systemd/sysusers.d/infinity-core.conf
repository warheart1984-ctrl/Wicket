# Accounts and groups. Install as /usr/lib/sysusers.d/infinity-core.conf and run `systemd-sysusers`.
#
# Type Name           ID  GECOS                                Home               Shell
g      ick-socket     -   -
g      ick-audit      -   -
u      ick-signer     -   "Infinity signer service"            /var/lib/ick       /usr/sbin/nologin
u      ick-publisher  -   "Infinity anchor publisher"          /var/lib/ick-publisher /usr/sbin/nologin
u      nova           -   "Nova shell"                         /var/lib/nova      /usr/sbin/nologin
# Nova may use the signer's socket. The publisher may read the log and anchor. Nothing else.
m      nova           ick-socket
m      ick-publisher  ick-audit
# The human who runs the operator screen must be added to ick-audit by hand (it is a real person's
# account, not a system one):  usermod -aG ick-audit <your-login>
